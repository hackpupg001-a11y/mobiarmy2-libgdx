name: Build Fully Offline Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Localize CDN icons and fonts in source
        run: |
          python3 - <<'PYEOF'
          import re, subprocess, hashlib
          from pathlib import Path

          SRC_DIRS = ["src", "public", "index.html"]
          ICON_DIR = Path("public/icons/tech")
          FONT_DIR = Path("public/fonts")
          ICON_DIR.mkdir(parents=True, exist_ok=True)
          FONT_DIR.mkdir(parents=True, exist_ok=True)

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36"

          def find_files(paths):
              files = []
              for p in paths:
                  path = Path(p)
                  if path.is_file():
                      files.append(path)
                  elif path.is_dir():
                      files.extend(f for f in path.rglob("*") if f.is_file() and f.suffix.lower() in (".js", ".jsx", ".ts", ".tsx", ".html", ".css"))
              return files

          # ---- 1. Localize icon CDN URLs (jsdelivr devicons, simpleicons) ----
          icon_pattern = re.compile(r'https://cdn\.(?:jsdelivr\.net/gh/devicons/devicon(?:@latest)?/icons/[^\s"\'\)]+|simpleicons\.org/[^\s"\'\)]+)')

          for f in find_files(SRC_DIRS):
              text = f.read_text(encoding="utf-8", errors="ignore")
              changed = False
              for m in set(icon_pattern.findall(text)):
                  pass
              urls = set(icon_pattern.findall(text))
              for url in urls:
                  if "simpleicons.org" in url:
                      slug = url.split("simpleicons.org/")[1].split("/")[0]
                      name = f"{slug}.svg"
                  else:
                      name = url.split("/")[-1]
                  dest = ICON_DIR / name
                  if not dest.exists():
                      print(f"Downloading icon {url} -> {dest}")
                      subprocess.run(["curl", "-sL", "-A", UA, url, "-o", str(dest)])
                  text = text.replace(url, f"/icons/tech/{name}")
                  changed = True
              if changed:
                  f.write_text(text, encoding="utf-8")

          # ---- 2. Localize Google Fonts ----
          html = Path("index.html")
          html_text = html.read_text(encoding="utf-8")
          font_css_urls = re.findall(r'https://fonts\.googleapis\.com/css2\?[^\s"\']+', html_text)

          if font_css_urls:
              combined_css = ""
              for url in font_css_urls:
                  result = subprocess.run(["curl", "-sL", "-A", UA, url], capture_output=True, text=True)
                  css = result.stdout
                  font_urls = re.findall(r'url\((https://fonts\.gstatic\.com/[^)]+)\)', css)
                  for f_url in font_urls:
                      fname = f_url.split("/")[-1].split("?")[0]
                      if not fname.endswith((".woff2", ".woff", ".ttf")):
                          fname += ".woff2"
                      dest = FONT_DIR / fname
                      if not dest.exists():
                          print(f"Downloading font {f_url} -> {dest}")
                          subprocess.run(["curl", "-sL", "-A", UA, f_url, "-o", str(dest)])
                      css = css.replace(f_url, f"/fonts/{fname}")
                  combined_css += css + "\n"

              (FONT_DIR / "google-fonts.css").write_text(combined_css, encoding="utf-8")

              # Remove old font links/preconnects, insert local stylesheet link
              html_text = re.sub(r'\s*<link[^>]*fonts\.googleapis\.com"[^>]*preconnect[^>]*/>\n?', '', html_text)
              html_text = re.sub(r'\s*<link[^>]*fonts\.gstatic\.com"[^>]*preconnect[^>]*/>\n?', '', html_text)
              html_text = re.sub(r'\s*<link[^>]*fonts\.googleapis\.com/css2[^>]*/>\n?', '', html_text)
              html_text = html_text.replace(
                  "</title>",
                  "</title>\n    <link href=\"/fonts/google-fonts.css\" rel=\"stylesheet\" />"
              )
              html.write_text(html_text, encoding="utf-8")

          print("CDN localization done.")
          PYEOF

      - name: Verify no external CDN references remain
        run: |
          if grep -rn "fonts.googleapis\|fonts.gstatic\|cdn.jsdelivr\|cdn.simpleicons" src public index.html; then
            echo "WARNING: external references still found above"
          else
            echo "Clean: no external CDN references left."
          fi

      - name: Build project
        run: npm run build

      - name: Package fully offline bundle (source + node_modules + dist)
        run: |
          mkdir -p offline-package
          rsync -a --exclude='.git' --exclude='offline-package' ./ offline-package/
          zip -r army2-offline-full.zip offline-package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: army2-offline-full
          path: army2-offline-full.zip
          retention-days: 14